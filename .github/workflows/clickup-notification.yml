name: Notify ClickUp

on:
  workflow_call:
    inputs:
      status:
        description: 'Deployment status (success or failure)'
        required: true
        type: string
      environment:
        description: 'Environment name (Production, Development, Preview)'
        required: true
        type: string
      service_name:
        description: 'Service name'
        required: true
        type: string
      service_url:
        description: 'Service URL'
        required: true
        type: string
      commit_sha:
        description: 'Commit SHA'
        required: false
        type: string
        default: ''
      actor:
        description: 'GitHub actor'
        required: false
        type: string
        default: ''
      run_id:
        description: 'GitHub run ID'
        required: false
        type: string
        default: ''
      repository:
        description: 'GitHub repository'
        required: false
        type: string
        default: ''
    secrets:
      CLICKUP_API_TOKEN:
        description: 'ClickUp API token'
        required: true
      CLICKUP_WEBHOOK_URL:
        description: 'ClickUp webhook URL'
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        if: inputs.status == 'success'
        uses: actions/checkout@v4

      - name: Send notification to ClickUp
        run: |
          COMMIT_SHA_SHORT=$(echo "${{ inputs.commit_sha }}" | cut -c1-7)

          if [ "${{ inputs.status }}" = "success" ]; then
            COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1 2>/dev/null || echo "Manual deployment")

            curl --request POST \
              --url ${{ secrets.CLICKUP_WEBHOOK_URL }} \
              --header 'Authorization: ${{ secrets.CLICKUP_API_TOKEN }}' \
              --header 'accept: application/json' \
              --header 'content-type: application/json' \
              --data "{
                \"type\": \"message\",
                \"content_format\": \"text/md\",
                \"content\": \"**[ DEPLOYMENT LOG ]**\n\n✅ **Deployment exitoso - ${{ inputs.service_name }}**\n\n🌐 **URL:** ${{ inputs.service_url }}\n📦 **Servicio:** ${{ inputs.service_name }} (${{ inputs.environment }})\n🔨 **Commit:** ${COMMIT_MSG} (\`${COMMIT_SHA_SHORT}\`)\n👤 **Por:** ${{ inputs.actor }}\n⏰ **Hora:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')\"
              }"
          else
            COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1 2>/dev/null || echo "Manual deployment")

            curl --request POST \
              --url ${{ secrets.CLICKUP_WEBHOOK_URL }} \
              --header 'Authorization: ${{ secrets.CLICKUP_API_TOKEN }}' \
              --header 'accept: application/json' \
              --header 'content-type: application/json' \
              --data "{
                \"type\": \"message\",
                \"content_format\": \"text/md\",
                \"content\": \"**[ DEPLOYMENT LOG ]**\n\n❌ **Deployment falló - ${{ inputs.service_name }}**\n\n📦 **Servicio:** ${{ inputs.service_name }} (${{ inputs.environment }})\n🔨 **Commit:** ${COMMIT_MSG} (\`${COMMIT_SHA_SHORT}\`)\n👤 **Por:** ${{ inputs.actor }}\n⏰ **Hora:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')\n\n🔗 [Ver detalles del error en GitHub Actions](https://github.com/${{ inputs.repository }}/actions/runs/${{ inputs.run_id }})\"
              }"
          fi
