# DEPRECADO (PLA-1771): los avisos de PR los manda el webhook de la org +
# Lambda pr-notify (infra/pr-notify). El job queda en `if: false` para que los
# `pr-notify.yml` que todavía lo llaman no fallen ni gasten minutos (un job
# salteado no se cobra) ni dupliquen el aviso. Borrar `pr-notify.yml` del repo
# que lo tenga; cuando no quede ninguno, se borra este archivo.
name: PR Notify

on:
  workflow_call:
    inputs:
      action:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      pr_title:
        required: true
        type: string
      pr_url:
        required: true
        type: string
      pr_author:
        required: true
        type: string
      repository:
        required: true
        type: string
      head_branch:
        required: true
        type: string
      base_branch:
        required: true
        type: string
      reviewer:
        required: false
        type: string
        default: ""
      is_merged:
        required: false
        type: string
        default: "false"
    secrets:
      PR_ALERTS_URL:
        required: false

jobs:
  notify:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: "true"
